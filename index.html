<!DOCTYPE html>
<html>
    <head>
        <link href="styles.css" rel="stylesheet" type="text/css">
        <title>Incremental restart</title>
    </head>
    <body>
        <canvas id = "effects">
            <!-- effects HTML goes here -->
        </canvas>
        <!--Currencies get displayed here-->
        <div class="flex-vertical">
            <p id="points" class="font"></p>
            <fps id="fps" class="font"></fps>
            <br>
        </div>
        <!--Tabs-->
        <div class="flex-horizontal" id="tabs">
            <button id="tab_comp" style="margin: 2px;" class="font" onclick="switchTab(0, 0);">Complicators</button>
            <button id="tab_other" style="margin: 2px;" class="font" onclick="switchTab(1, 0);">Other</button>
            <button id="tab_simplify" style="margin: 2px;" class="font" onclick="switchTab(2, 0);">Simplify</button>
        </div>
        <br>
        <div class="flex-horizontal" id="other">
            <button id="tab_other_note" style="margin: 2px;" class="font" onclick="switchTab(0, 1);">Notes</button>
            <button id="tab_other_stat" style="margin: 2px;" class="font" onclick="switchTab(1, 1);">Statistics</button>
            <button id="tab_other_changeLog" style="margin: 2px;" class="font" onclick="switchTab(2, 1);">Change Log</button>
            <span id="changeLog"></span>
        </div>
        <!--Simplify Tab-->
        <div class="flex-vertical" id="simplify">
            <span id="simpEnergy" class="font"></span>
            <br>
            <button id="SER" onclick="simplifyReset();"></button>
            <button id="SEUPG1" onclick="simplify1Upg();"></button>
            <div id="simpTabs" class="flex-horizontal">
                <br>
                <button id="simplify_tab_simplify" class="font" style="margin: 2px;" onclick="switchTab(0, 1);">Main</button>
                <button id="simplify_tab_tts" class="font" style="margin: 2px;" onclick="switchTab(1, 1);updateChallenge('all');">TTS Challenges</button>
                <button id="simplify_tab_simpUpg" class="font" style="margin: 2px;" onclick="switchTab(2, 1);">Simplify Upgrades</button>
            </div>
            <br>
            <div class="flex-vertical" id="simpExP">
                <!-- generated in simplify.js -->
            </div>
            <div class="flex-vertical" id="ttsChal">
                <div class="flex-horizontal">
                    <button id="challengeStart1"  class="font" onclick="challengeToggle('simp');"></button>
                    <button id="completeChallenge1"  class="font" onclick="simplifyReset();">Complete Challenge</button>
                </div>
                <span id="simpChalDesc" class="font"></span>
                <span id="simpChalRew" class="font"></span>
                <div id="ttsChals">
                    <!--Challenge html code autogenerated in the html.js file-->
                </div>
                <button id="ttsChalArea"  class="font" onclick=""></button>
            </div>
        </div>    
        <!--Generators-->
        <div class="flex-vertical" id="comp">
            <!--Generator html code autogenerated in the html.js file-->
        </div>
        <div class="w3-container w3-center font" id="progBars">
            <div id="progBarBase" class="w3-container" style="height:24px; width:98%"></div>
            <div id="progressBar1" class="w3-container" style="text-align: center; height:24px; width:1%"></div>
        </div>
        <script src="src/utils/break_eternity.js"></script>
        <script src="src/utils/utils.js"></script>
        <script src="src/utils/funcs.js"></script>
        <script src="src/init.js"></script>
        <script src="src/html.js"></script>
        <script src="src/main.js"></script>
        <script src="src/comp.js"></script>
        <script src="src/simplify.js"></script>
    </body>
</html>
